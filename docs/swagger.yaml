          schema:
            $ref: '#/definitions/github_com_misalima_edunex-backend_internal_api_handlers_dto_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_misalima_edunex-backend_internal_api_handlers_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates the name of a user.
      parameters:
      - description: User ID
        in: path
